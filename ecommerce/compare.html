<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>So sánh sản phẩm - ShopVN</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css?v=4" />
  <style>
    .compare-table th, .compare-table td { vertical-align: middle; min-width: 200px; }
    .compare-table .row-label { min-width: 130px; font-weight:600; background:#f8f9fa; }
    .compare-img { width:160px; height:160px; object-fit:contain; background:#f8f9fa; border-radius:12px; padding:1rem; }
    .remove-compare { position:absolute; top:.5rem; right:.5rem; }
    .best-value { background:#fff3cd; border-radius:6px; padding:.1rem .4rem; font-size:.75rem; font-weight:600; color:#664d03; }
  </style>
</head>
<body style="min-height:100vh;display:flex;flex-direction:column">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="index.html"><i class="bi bi-bag-heart-fill me-2"></i>ShopVN</a>
      <div class="d-flex align-items-center gap-2">
        <a href="cart.html" class="btn btn-outline-light position-relative">
          <i class="bi bi-cart3 fs-5"></i>
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cartCount">0</span>
        </a>
        <div id="navAuthArea"></div>
      </div>
    </div>
  </nav>

  <div class="bg-light border-bottom py-2">
    <div class="container"><nav aria-label="breadcrumb"><ol class="breadcrumb mb-0">
      <li class="breadcrumb-item"><a href="index.html">Trang chủ</a></li>
      <li class="breadcrumb-item"><a href="products.html">Sản phẩm</a></li>
      <li class="breadcrumb-item active">So sánh</li>
    </ol></nav></div>
  </div>

  <div class="container py-5 flex-grow-1">
    <h2 class="fw-bold mb-2"><i class="bi bi-arrow-left-right me-2 text-primary"></i>So sánh sản phẩm</h2>
    <p class="text-muted mb-4">Tối đa 4 sản phẩm. <a href="products.html">Thêm sản phẩm để so sánh →</a></p>

    <div id="emptyCompare" class="text-center py-5 d-none">
      <i class="bi bi-arrow-left-right fs-1 d-block mb-3 opacity-25"></i>
      <h5 class="text-muted">Chưa có sản phẩm nào để so sánh</h5>
      <a href="products.html" class="btn btn-primary mt-2"><i class="bi bi-shop me-2"></i>Chọn sản phẩm để so sánh</a>
    </div>

    <div id="loadingCompare" class="text-center py-5">
      <div class="spinner-border text-primary"></div><p class="mt-2 text-muted">Đang tải...</p>
    </div>

    <div class="table-responsive" id="compareTableWrap" style="display:none">
      <table class="table compare-table border">
        <tbody id="compareBody"></tbody>
      </table>
    </div>
  </div>

  <footer class="bg-dark text-white py-4 mt-auto"><div class="container text-center"><p class="mb-0 text-muted">&copy; 2026 ShopVN. All rights reserved.</p></div></footer>

  <!-- Toast -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999">
    <div id="toastMsg" class="toast align-items-center border-0" role="alert">
      <div class="d-flex"><div class="toast-body" id="toastBody"></div><button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/cache.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/compare.js"></script>
  <script src="js/footer-template.js"></script>
</body>
</html>
