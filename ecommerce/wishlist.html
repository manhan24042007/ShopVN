<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yêu thích - ShopVN</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css?v=4" />
</head>
<body style="min-height:100vh;display:flex;flex-direction:column">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="index.html"><i class="bi bi-bag-heart-fill me-2"></i>ShopVN</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Trang chủ</a></li>
          <li class="nav-item"><a class="nav-link" href="products.html">Sản phẩm</a></li>
        </ul>
        <form class="d-flex me-3" id="searchForm" role="search">
          <div class="input-group"><input class="form-control" type="search" id="searchInput" placeholder="Tìm kiếm..." /><button class="btn btn-light" type="submit"><i class="bi bi-search"></i></button></div>
        </form>
        <div class="d-flex align-items-center gap-2">
          <a href="cart.html" class="btn btn-outline-light position-relative">
            <i class="bi bi-cart3 fs-5"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cartCount">0</span>
          </a>
          <div id="navAuthArea"></div>
        </div>
      </div>
    </div>
  </nav>

  <div class="bg-light border-bottom py-2">
    <div class="container"><nav aria-label="breadcrumb"><ol class="breadcrumb mb-0">
      <li class="breadcrumb-item"><a href="index.html">Trang chủ</a></li>
      <li class="breadcrumb-item active">Danh sách yêu thích</li>
    </ol></nav></div>
  </div>

  <div class="container py-5 flex-grow-1">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div>
        <h2 class="fw-bold mb-0"><i class="bi bi-heart-fill text-danger me-2"></i>Danh sách yêu thích</h2>
        <small class="text-muted" id="wishCount">0 sản phẩm</small>
      </div>
      <div class="d-flex gap-2" id="wishActions">
        <button class="btn btn-primary" id="addAllBtn" style="display:none">
          <i class="bi bi-cart-plus me-2"></i>Thêm tất cả vào giỏ
        </button>
        <button class="btn btn-outline-danger btn-sm" id="clearWishBtn" style="display:none">
          <i class="bi bi-trash me-1"></i>Xóa tất cả
        </button>
      </div>
    </div>

    <!-- Empty state -->
    <div id="wishEmpty" class="text-center py-5 d-none">
      <i class="bi bi-heart fs-1 text-muted d-block mb-3 opacity-25"></i>
      <h5 class="text-muted">Chưa có sản phẩm yêu thích nào</h5>
      <p class="text-muted mb-4">Nhấn biểu tượng ♡ trên sản phẩm để thêm vào danh sách yêu thích</p>
      <a href="products.html" class="btn btn-primary px-4"><i class="bi bi-shop me-2"></i>Khám phá sản phẩm</a>
    </div>

    <!-- Loading -->
    <div id="wishLoading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 text-muted">Đang tải...</p>
    </div>

    <!-- Grid -->
    <div class="row g-3" id="wishGrid"></div>
  </div>

  <!-- Footer -->
  <footer class="bg-dark text-white py-4 mt-auto"><div class="container text-center"><p class="mb-0 text-muted">&copy; 2026 ShopVN. All rights reserved.</p></div></footer>

  <!-- Toast -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999">
    <div id="toastMsg" class="toast align-items-center border-0" role="alert">
      <div class="d-flex"><div class="toast-body" id="toastBody"></div><button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/cache.js"></script>
  <script src="js/api.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/search.js"></script>
  <script src="js/minicart.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    const WL_KEY = 'shopvn_wishlist';
    let wishProducts = [];

    document.addEventListener('DOMContentLoaded', async () => {
      Cart.updateCartUI();
      const sf=document.getElementById('searchForm'),si=document.getElementById('searchInput');
      if(sf) sf.addEventListener('submit',e=>{e.preventDefault();const q=si.value.trim();if(q)location.href='products.html?search='+encodeURIComponent(q);});

      await loadWishlist();

      document.getElementById('addAllBtn').addEventListener('click', () => {
        wishProducts.forEach(p => Cart.add(p.id, p.title, p.price, p.image));
        showToast(`<i class="bi bi-cart-check me-2"></i>Đã thêm ${wishProducts.length} sản phẩm vào giỏ hàng!`, 'success');
      });

      document.getElementById('clearWishBtn').addEventListener('click', () => {
        if(confirm('Xóa toàn bộ danh sách yêu thích?')) {
          localStorage.removeItem(WL_KEY);
          loadWishlist();
        }
      });
    });

    async function loadWishlist() {
      const loading = document.getElementById('wishLoading');
      const grid    = document.getElementById('wishGrid');
      const empty   = document.getElementById('wishEmpty');
      const countEl = document.getElementById('wishCount');
      const addBtn  = document.getElementById('addAllBtn');
      const clrBtn  = document.getElementById('clearWishBtn');

      loading.classList.remove('d-none');
      grid.innerHTML = '';

      const ids = JSON.parse(localStorage.getItem(WL_KEY) || '[]');

      if (ids.length === 0) {
        loading.classList.add('d-none');
        empty.classList.remove('d-none');
        countEl.textContent = '0 sản phẩm';
        addBtn.style.display = clrBtn.style.display = 'none';
        return;
      }

      empty.classList.add('d-none');

      try {
        wishProducts = await Promise.all(ids.map(id => API.getProductById(id)));
        loading.classList.add('d-none');
        countEl.textContent = `${wishProducts.length} sản phẩm`;
        addBtn.style.display = clrBtn.style.display = 'inline-flex';

        grid.innerHTML = wishProducts.map(p => {
          const discount = Math.floor(Math.random()*20)+5;
          const oldPrice = (p.price*(1+discount/100)).toFixed(2);
          return `
            <div class="col-6 col-md-4 col-lg-3">
              <div class="card product-card h-100 fade-in" data-id="${p.id}">
                <div class="card-img-wrapper" style="position:relative">
                  <img referrerpolicy="no-referrer" src="${API.escapeHtml(p.image)}" alt="${API.escapeHtml(p.title)}" loading="lazy" />
                  <span class="badge-category ${API.getCategoryBadgeClass(p.category)}">${API.getCategoryLabel(p.category)}</span>
                  <button class="overlay-btn position-absolute" style="top:.5rem;right:.5rem;width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2"
                          onclick="removeFromWishlist(${p.id}, this)" title="Xóa khỏi yêu thích">
                    <i class="bi bi-heart-fill text-danger"></i>
                  </button>
                </div>
                <div class="card-body d-flex flex-column">
                  <a href="product-detail.html?id=${p.id}" class="product-title">${API.escapeHtml(p.title)}</a>
                  <div class="d-flex align-items-center gap-1 my-1">
                    <span class="stars-filled" style="font-size:.8rem">★</span>
                    <small class="text-muted">${p.rating.rate} (${p.rating.count})</small>
                  </div>
                  <div class="mt-auto">
                    <div class="mb-2">
                      <span class="product-price">${API.formatPrice(p.price)}</span>
                      <span class="product-price-old ms-2">${API.formatPrice(oldPrice)}</span>
                      <span class="badge bg-danger ms-1">-${discount}%</span>
                    </div>
                    <div class="d-flex gap-2">
                      <button class="btn btn-primary btn-sm flex-grow-1" onclick="Cart.add(${p.id},'${p.title.replace(/'/g,"\\'")}',${p.price},'${p.image}')">
                        <i class="bi bi-cart-plus me-1"></i>Thêm vào giỏ
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>`;
        }).join('');
      } catch(err) {
        loading.classList.add('d-none');
        grid.innerHTML = '<div class="col-12"><div class="alert alert-danger">Không thể tải sản phẩm. Vui lòng thử lại.</div></div>';
      }
    }

    function removeFromWishlist(id, btn) {
      let wl = JSON.parse(localStorage.getItem(WL_KEY)||'[]');
      wl = wl.filter(i => i !== id);
      localStorage.setItem(WL_KEY, JSON.stringify(wl));
      const card = btn.closest('.col-6, .col-md-4');
      if(card) { card.style.opacity='0'; card.style.transform='scale(.9)'; card.style.transition='all .3s'; setTimeout(()=>card.remove(), 300); }
      wishProducts = wishProducts.filter(p => p.id !== id);
      document.getElementById('wishCount').textContent = `${wishProducts.length} sản phẩm`;
      if(wishProducts.length === 0) setTimeout(loadWishlist, 350);
      showToast('Đã xóa khỏi danh sách yêu thích.', 'secondary');
    }
  </script>
  <script src="js/footer-template.js"></script>
</body>
</html>
