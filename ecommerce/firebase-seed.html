<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nạp sản phẩm vào Firebase - ShopVN</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <main class="container py-5" style="max-width:720px">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5">
        <h1 class="h3 mb-3">Nạp sản phẩm vào Firestore</h1>
        <p class="text-muted">Công cụ này lấy catalog hiện tại từ FakeStore API và ghi vào collection <code>products</code>.</p>
        <div id="account" class="alert alert-secondary">Đang kiểm tra tài khoản...</div>
        <button id="seedBtn" class="btn btn-primary" disabled>Nạp/cập nhật sản phẩm</button>
        <a href="index.html" class="btn btn-outline-secondary ms-2">Về trang chủ</a>
        <div id="result" class="mt-3"></div>
      </div>
    </div>
  </main>
  <script src="js/firebase-config.js?v=20260807-auth-fix"></script>
  <script src="js/auth.js?v=20260807-auth-fix"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const account = document.getElementById('account');
      const button = document.getElementById('seedBtn');
      const result = document.getElementById('result');
      const user = await Auth.ready();
      if (!user) {
        account.className = 'alert alert-warning';
        account.innerHTML = 'Bạn cần <a href="auth.html?redirect=firebase-seed.html">đăng nhập</a> bằng tài khoản quản trị.';
        return;
      }
      account.textContent = `Đã đăng nhập: ${user.email}`;
      button.disabled = false;
      button.addEventListener('click', async () => {
        button.disabled = true;
        result.innerHTML = '<div class="alert alert-info">Đang tải và ghi dữ liệu...</div>';
        try {
          const response = await fetch('https://fakestoreapi.com/products');
          if (!response.ok) throw new Error(`FakeStore API trả về HTTP ${response.status}`);
          const products = await response.json();
          const count = await FirebaseService.saveProducts(products);
          result.innerHTML = `<div class="alert alert-success">Đã ghi thành công ${count} sản phẩm vào Firestore.</div>`;
        } catch (err) {
          result.innerHTML = `<div class="alert alert-danger">${String(err.message || err).replace(/</g, '&lt;')}</div>`;
        } finally { button.disabled = false; }
      });
    });
  </script>
</body>
</html>
