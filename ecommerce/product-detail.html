<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chi tiết sản phẩm - ShopVN</title>
  <meta name="description" content="Xem chi tiết sản phẩm, đánh giá khách hàng và mua hàng tại ShopVN." />
  <meta property="og:type" content="product" />
  <meta property="og:title" id="ogTitle" content="Chi tiết sản phẩm - ShopVN" />
  <meta property="og:description" id="ogDesc" content="Xem chi tiết và mua sắm tại ShopVN." />
  <meta property="og:image" id="ogImage" content="" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d6efd" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css?v=4" />
</head>
<body class="site-page">
  <div class="site-page d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="index.html"><i class="bi bi-bag-heart-fill me-2"></i>ShopVN</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Trang chủ</a></li>
          <li class="nav-item"><a class="nav-link" href="products.html">Sản phẩm</a></li>
          <li class="nav-item"><a class="nav-link" href="wishlist.html"><i class="bi bi-heart me-1"></i>Yêu thích</a></li>
          <li class="nav-item"><a class="nav-link" href="compare.html"><i class="bi bi-arrow-left-right me-1"></i>So sánh</a></li>
        </ul>
        <form class="d-flex me-3" id="searchForm" role="search">
          <div class="input-group">
            <input class="form-control" type="search" id="searchInput" placeholder="Tìm kiếm..." />
            <button class="btn btn-light" type="submit"><i class="bi bi-search"></i></button>
          </div>
        </form>
        <div class="d-flex align-items-center gap-2">
          <a href="cart.html" class="btn btn-outline-light position-relative">
            <i class="bi bi-cart3 fs-5"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cartCount">0</span>
          </a>
          <div id="navAuthArea"></div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Breadcrumb -->
  <div class="bg-light border-bottom py-2">
    <div class="container">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
          <li class="breadcrumb-item"><a href="index.html">Trang chủ</a></li>
          <li class="breadcrumb-item"><a href="products.html">Sản phẩm</a></li>
          <li class="breadcrumb-item active" id="breadcrumbProduct">Chi tiết sản phẩm</li>
        </ol>
      </nav>
    </div>
  </div>

  <!-- Product Detail -->
  <div class="container py-5" id="productDetailContainer">
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 text-muted">Đang tải thông tin sản phẩm...</p>
    </div>
  </div>

  <!-- Reviews Section -->
  <section class="py-5">
    <div class="container">
      <h4 class="fw-bold mb-4"><i class="bi bi-chat-square-text me-2 text-primary"></i>Đánh giá & Nhận xét</h4>
      <div class="row g-4">
        <div class="col-lg-8">
          <div id="reviewList" class="mb-4"></div>
        </div>
        <div class="col-lg-4">
          <div id="reviewFormWrapper"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Recently Viewed Section -->
  <section class="py-4 bg-light" id="recentlyViewedSection">
    <div class="container">
      <h5 class="fw-bold mb-3"><i class="bi bi-clock-history me-2 text-muted"></i>Đã xem gần đây</h5>
      <div id="recentlyViewedStrip"></div>
    </div>
  </section>

  <!-- Related Products -->
  <section class="py-5 bg-white">
    <div class="container">
      <h4 class="fw-bold mb-4">Sản phẩm liên quan</h4>
      <div class="row g-3" id="relatedProducts">
        <div class="col-12 text-center py-4">
          <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-dark text-white py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-0 text-muted">&copy; 2026 ShopVN. All rights reserved.</p>
    </div>
  </footer>

  <!-- Toast -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
    <div id="toastMsg" class="toast align-items-center text-bg-success border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toastBody">
          <i class="bi bi-check-circle me-2"></i>Đã thêm vào giỏ hàng!
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/cache.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/compare.js"></script>
  <script src="js/search.js"></script>
  <script src="js/minicart.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/recently-viewed.js"></script>
  <script src="js/reviews.js"></script>
  <script src="js/product-detail.js"></script>
  <script src="js/footer-template.js"></script>
  </div>
</body>
</html>
